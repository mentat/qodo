name: Deploy to Cloud Run & Firebase Hosting

on:
  push:
    branches: [main]

env:
  PROJECT_ID: qodo-demo
  REGION: us-central1
  AR_REPO: us-central1-docker.pkg.dev/qodo-demo/qodo
  PUBSUB_PUSH_AUDIENCE: qodo-pubsub
  PUBSUB_PUSH_SERVICE_ACCOUNT: pubsub-push@qodo-demo.iam.gserviceaccount.com

jobs:
  deploy-api:
    runs-on: ubuntu-latest
    outputs:
      api_url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - uses: google-github-actions/setup-gcloud@v2

      - name: Test API
        run: cd api && go test ./...

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Cross-compile API binary
        run: cd api && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o server .

      - name: Build and Push API Image
        run: |
          docker build --platform linux/amd64 -t ${{ env.AR_REPO }}/qodo-api:${{ github.sha }} ./api
          docker push ${{ env.AR_REPO }}/qodo-api:${{ github.sha }}

      - id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: qodo-api
          region: ${{ env.REGION }}
          image: ${{ env.AR_REPO }}/qodo-api:${{ github.sha }}
          env_vars: |
            GOOGLE_CLOUD_PROJECT=${{ env.PROJECT_ID }}
            GOOGLE_CLOUD_LOCATION=${{ env.REGION }}
            NEWSAPI_API_KEY=${{ secrets.NEWSAPI_API_KEY }}
            PUBSUB_PUSH_AUDIENCE=${{ env.PUBSUB_PUSH_AUDIENCE }}
          flags: --allow-unauthenticated

      - name: Ensure Pub/Sub push resources
        env:
          API_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail

          ensure_topic() {
            local topic="$1"
            gcloud pubsub topics describe "$topic" --project "${PROJECT_ID}" >/dev/null 2>&1 \
              || gcloud pubsub topics create "$topic" --project "${PROJECT_ID}"
          }

          ensure_push_subscription() {
            local sub="$1"
            local topic="$2"
            local endpoint="$3"
            local ack_deadline="$4"

            if gcloud pubsub subscriptions describe "$sub" --project "${PROJECT_ID}" >/dev/null 2>&1; then
              gcloud pubsub subscriptions update "$sub" \
                --project "${PROJECT_ID}" \
                --push-endpoint "$endpoint" \
                --push-auth-service-account "${PUBSUB_PUSH_SERVICE_ACCOUNT}" \
                --push-auth-token-audience "${PUBSUB_PUSH_AUDIENCE}" \
                --ack-deadline "$ack_deadline"
            else
              gcloud pubsub subscriptions create "$sub" \
                --project "${PROJECT_ID}" \
                --topic "$topic" \
                --push-endpoint "$endpoint" \
                --push-auth-service-account "${PUBSUB_PUSH_SERVICE_ACCOUNT}" \
                --push-auth-token-audience "${PUBSUB_PUSH_AUDIENCE}" \
                --ack-deadline "$ack_deadline"
            fi
          }

          ensure_topic email-replies
          ensure_topic suite-drip
          ensure_topic risk-turns

          ensure_push_subscription email-replies-push email-replies "${API_URL}/api/pubsub/email-reply" 60
          ensure_push_subscription suite-drip-push suite-drip "${API_URL}/api/pubsub/drip" 120
          ensure_push_subscription risk-turns-push risk-turns "${API_URL}/api/pubsub/risk-turn" 120

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: deploy-api
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install, Test, and Build Frontend
        env:
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${VITE_MAPBOX_TOKEN}" ]; then
            echo "::error::VITE_MAPBOX_TOKEN secret is required for the Risk globe"
            exit 1
          fi
          cd frontend
          bun install
          bun test
          bun run build

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.GCP_SA_KEY }}'
          channelId: live
          projectId: ${{ env.PROJECT_ID }}
